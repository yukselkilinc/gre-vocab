    <!-- Application Logic -->
    <script>
        // 0. Load learned words from local storage
        let learnedWords = new Set(JSON.parse(localStorage.getItem('learned-words') || '[]'));
        let activeWord = '';

        function saveLearnedWords() {
            localStorage.setItem('learned-words', JSON.stringify(Array.from(learnedWords)));
        }

        // 1. Build database index
        const DB_INDEX = {};
        if (typeof coreDatabase !== 'undefined') {
            for (const cat in coreDatabase) {
                for (const set in coreDatabase[cat]) {
                    coreDatabase[cat][set].forEach(item => {
                        const key = item.word.toLowerCase().trim();
                        if (!DB_INDEX[key]) DB_INDEX[key] = [];
                        DB_INDEX[key].push({
                            w: item.word,
                            t: item.type,
                            d: item.def,
                            e: item.example,
                            long_example: item.long_example,
                            cat: cat,
                            set: set
                        });
                    });
                }
            }
        }

        // 2. Initialize UI theme
        function updateThemeBtnIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const btn = document.getElementById('theme-btn-icon');
            if (isDark) {
                // Sun Icon
                btn.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>`;
            } else {
                // Moon Icon
                btn.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>`;
            }
        }
        
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('greDarkMode', isDark ? 'dark' : 'light');
            updateThemeBtnIcon();
        }
        updateThemeBtnIcon();

        // 3. Render cards list
        const grid = document.getElementById('groups-grid');
        
        function renderGroups(filterQuery = '') {
            grid.innerHTML = '';
            let matchCount = 0;
            const query = filterQuery.toLowerCase().trim();
            
            VOCAB_GROUPS.forEach(group => {
                // Check matching conditions
                const matchesId = group.id.toString() === query;
                const matchesName = group.name.toLowerCase().includes(query);
                const matchesDesc = group.description.toLowerCase().includes(query);
                const matchesWords = group.words.some(w => w.toLowerCase().includes(query));
                
                if (query && !matchesId && !matchesName && !matchesDesc && !matchesWords) {
                    return; // Skip
                }
                
                matchCount++;
                
                // Construct card element
                const card = document.createElement('div');
                const tabIdx = (group.id - 1) % 8;
                card.className = `vocab-card tab-${tabIdx} bg-white dark:bg-ink-900 border border-paper-200 dark:border-ink-800 rounded-lg p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between`;
                
                // Separate core words (clickable) and basic words (unclickable)
                const coreWords = [];
                const basicWords = [];
                group.words.forEach(w => {
                    const cleanW = w.toLowerCase().trim();
                    if (DB_INDEX[cleanW]) {
                        coreWords.push(w);
                    } else {
                        basicWords.push(w);
                    }
                });

                // Head section
                let titleHtml = `<div class="flex items-start justify-between gap-2">`;
                titleHtml += `<div class="min-w-0">`;
                titleHtml += `<div class="group-eyebrow text-[11px] font-mono font-semibold uppercase tracking-wider mb-0.5">Group ${group.id}</div>`;
                titleHtml += `<h3 class="font-serif text-lg font-semibold text-ink-900 dark:text-paper-50 leading-snug">${group.name}</h3>`;
                titleHtml += `</div>`;
                titleHtml += `<span class="bg-paper-100 dark:bg-ink-800 text-ink-500 dark:text-ink-300 text-[11px] px-2.5 py-1 rounded-full shrink-0 font-mono font-medium">${group.words.length}</span>`;
                titleHtml += `</div>`;
                
                // Desc section
                const descHtml = `<p class="text-[13px] text-ink-500 dark:text-ink-300 mt-1.5 font-normal leading-relaxed">${group.description}</p>`;
                
                // Words list section
                let wordsHtml = `<div class="flex flex-wrap gap-1.5 mt-4 flex-1 items-start content-start">`;
                
                // 1. Render core words (clickable)
                coreWords.forEach(w => {
                    const cleanW = w.toLowerCase().trim();
                    const isLearned = learnedWords.has(cleanW);
                    
                    let chipClass = 'word-chip-core font-mono-word px-3 py-1.5 rounded-md text-[13px] font-medium cursor-pointer border select-none transition-colors ';
                    if (isLearned) {
                        chipClass += 'is-learned text-white border-transparent shadow-sm';
                    } else {
                        chipClass += 'bg-paper-100/80 hover:bg-paper-200 text-ink-700 border-paper-200 hover:border-paper-300 dark:bg-ink-800/80 dark:hover:bg-ink-700 dark:text-ink-200 dark:border-ink-700 dark:hover:border-ink-600';
                    }
                    wordsHtml += `<span class="${chipClass}" onclick="showWordDetails('${w}')">${w}</span>`;
                });
                
                // 2. Render basic words (unclickable, grayed out/subtle)
                basicWords.forEach(w => {
                    const badgeClass = 'font-mono-word px-3 py-1.5 rounded-md text-[13px] font-medium border select-none bg-transparent border-dashed border-paper-300 text-ink-400 dark:border-ink-700 dark:text-ink-500 cursor-default';
                    wordsHtml += `<span class="${badgeClass}" title="Basic word">${w}</span>`;
                });
                
                wordsHtml += `</div>`;
                
                card.innerHTML = `
                    <div>
                        ${titleHtml}
                        ${descHtml}
                    </div>
                    ${wordsHtml}
                `;
                grid.appendChild(card);
            });
            
            // Show no results if count is 0
            const noResults = document.getElementById('no-results');
            if (matchCount === 0) {
                noResults.classList.remove('hidden');
                grid.classList.add('hidden');
            } else {
                noResults.classList.add('hidden');
                grid.classList.remove('hidden');
            }
        }
        
        // Initial render
        renderGroups();

        // 4. Set up Search handler
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', (e) => {
            renderGroups(e.target.value);
        });

        // 5. Drawer display and lookup
        function updateDrawerLearnedButton() {
            const btn = document.getElementById('drawer-learned-btn');
            const isLearned = learnedWords.has(activeWord);
            
            if (isLearned) {
                btn.className = "px-3.5 py-2 rounded-lg text-[11px] font-bold uppercase tracking-wide border transition-colors flex items-center gap-1.5 select-none shrink-0 bg-[#25a27a] hover:bg-[#1f8967] text-white border-transparent shadow-sm";
                btn.querySelector('span').textContent = "Learned";
            } else {
                btn.className = "px-3.5 py-2 rounded-lg text-[11px] font-bold uppercase tracking-wide border transition-colors flex items-center gap-1.5 select-none shrink-0 bg-transparent hover:bg-emerald-50 text-emerald-700 border-emerald-600/50 hover:border-emerald-600 dark:bg-transparent dark:hover:bg-emerald-950/30 dark:text-emerald-400 dark:border-emerald-500/50 dark:hover:border-emerald-400";
                btn.querySelector('span').textContent = "Mark Learned";
            }
        }

        function toggleLearned() {
            if (!activeWord) return;
            
            const isLearned = learnedWords.has(activeWord);
            if (isLearned) {
                learnedWords.delete(activeWord);
            } else {
                learnedWords.add(activeWord);
            }
            saveLearnedWords();
            updateDrawerLearnedButton();
            
            const query = document.getElementById('search-input').value;
            renderGroups(query);
        }

        function showWordDetails(word) {
            const cleanWord = word.toLowerCase().trim();
            activeWord = cleanWord;
            
            let entry = null;
            let isFallback = false;
            
            // 1. Look up in main database
            if (DB_INDEX[cleanWord]) {
                entry = DB_INDEX[cleanWord][0];
            }
            
            // 2. Look up in fallback dictionary if not found in main DB
            if (!entry && typeof FALLBACK_DICT !== 'undefined' && FALLBACK_DICT[cleanWord]) {
                entry = FALLBACK_DICT[cleanWord];
                isFallback = true;
            }
            
            const drawerWord = document.getElementById('drawer-word');
            const drawerType = document.getElementById('drawer-type');
            const drawerDef = document.getElementById('drawer-def');
            const drawerEx1 = document.getElementById('drawer-ex1');
            const drawerEx2 = document.getElementById('drawer-ex2');
            
            drawerWord.textContent = word;
            
            if (entry) {
                drawerType.textContent = entry.type || entry.t || 'unknown';
                drawerType.classList.remove('hidden');
                
                // Def and examples lookup
                const definitionText = entry.def || entry.d || 'No definition available.';
                drawerDef.textContent = definitionText;
                
                const ex1Text = entry.example || entry.e || '';
                const ex2Text = entry.long_example || entry.le || '';
                
                // Format examples to highlight the word
                drawerEx1.innerHTML = highlightWord(ex1Text, word);
                drawerEx2.innerHTML = highlightWord(ex2Text, word);
            } else {
                // Not found anywhere
                drawerType.classList.add('hidden');
                drawerDef.textContent = 'Definition and examples not found in the database.js or fallback dictionary.';
                drawerEx1.innerHTML = '<span class="text-ink-400">No example available.</span>';
                drawerEx2.innerHTML = '<span class="text-ink-400">No example available.</span>';
            }
            
            // No synonyms section needed in details drawer (fully handled on the card grid)
            
            updateDrawerLearnedButton();
            
            // Slide open the drawer
            const drawer = document.getElementById('details-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            
            drawer.classList.remove('translate-x-full');
            backdrop.classList.remove('opacity-0', 'pointer-events-none');
            backdrop.classList.add('opacity-100', 'pointer-events-auto');
            document.body.style.overflow = 'hidden';
        }
        
        function closeDrawer() {
            const drawer = document.getElementById('details-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            
            drawer.classList.add('translate-x-full');
            backdrop.classList.remove('opacity-100', 'pointer-events-auto');
            backdrop.classList.add('opacity-0', 'pointer-events-none');
            document.body.style.overflow = '';
        }
        
        function highlightWord(sentence, word) {
            if (!sentence) return '<span class="text-ink-400">No example sentence available.</span>';
            
            // Clean word from any brackets/suffixes
            let cleanW = word.toLowerCase().trim();
            
            // Build regex with word boundary, matching inflected forms if possible (like plural, past tense)
            // Example: for "commend", also match "commends", "commended", "commending", "commendation"
            // For simple replacement, match the word stem
            let regexStr = '\\b' + cleanW;
            if (cleanW.endsWith('e')) {
                // e.g. abate -> abated, abating, abates
                regexStr = '\\b' + cleanW.slice(0, -1) + '(?:e|ed|ing|es)?\\b';
            } else if (cleanW.endsWith('y')) {
                // e.g. vilify -> vilified, vilifies, vilifying
                regexStr = '\\b' + cleanW.slice(0, -1) + '(?:y|ies|ied|ying)?\\b';
            } else {
                regexStr = '\\b' + cleanW + '(?:s|ed|ing)?\\b';
            }
            
            try {
                const regex = new RegExp(regexStr, 'gi');
                return sentence.replace(regex, (match) => {
                    return `<strong class="text-turquoise-600 dark:text-turquoise-400 font-bold">${match}</strong>`;
                });
            } catch (err) {
                // Fallback to literal search
                const idx = sentence.toLowerCase().indexOf(cleanW);
                if (idx !== -1) {
                    const originalMatch = sentence.substring(idx, idx + word.length);
                    return sentence.substring(0, idx) + 
                           `<strong class="text-turquoise-600 dark:text-turquoise-400 font-bold">${originalMatch}</strong>` + 
                           sentence.substring(idx + word.length);
                }
                return sentence;
            }
        }

        // Completely block zoom on mobile
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                const target = e.target;
                if (target.tagName !== 'INPUT' && target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                }
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>
</body>
