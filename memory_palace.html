<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The GRE Memory Palace</title>
<link rel="icon" href="palace_icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="palace_icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#11141b;
  --wall:#1b2130;
  --wall-2:#232b3d;
  --wall-3:#2a3346;
  --brass:#c9a15a;
  --brass-bright:#e0bd7d;
  --brass-dim:#8f7442;
  --parchment:#efe6d3;
  --parchment-dim:#e3d7bc;
  --ink-text:#241d13;
  --ink-text-soft:#584a34;
  --burgundy:#9a4646;
  --sage:#5c9179;
  --dusty-blue:#6a8bb5;
  --plum:#8f6ba3;
  --rust:#b56b45;
  --teal:#4a9497;
  --olive:#8a9c5c;
  --mustard:#c9a03a;
  --line:rgba(201,161,90,0.22);
  --shadow:0 12px 32px rgba(0,0,0,0.45);
  --font-display:'Cormorant Garamond', serif;
  --font-body:'Manrope', sans-serif;
}

*{box-sizing:border-box;}
html{margin:0;padding:0;overflow-y:scroll;}
body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 1200px 600px at 50% -10%, #232c40 0%, transparent 60%),
    var(--ink);
  color:var(--parchment);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  touch-action: manipulation;
}

.masthead-back-btn, .masthead-book-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--wall); color: var(--brass); flex-shrink: 0;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.masthead-back-btn:hover, .masthead-book-btn:hover {
  background: var(--wall-2); border-color: var(--brass); color: var(--brass-bright);
}

::selection{ background:var(--brass); color:var(--ink); }

a,button{ font-family:inherit; }

button{ cursor:pointer; }

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--wall); }
::-webkit-scrollbar-thumb{ background:var(--brass-dim); border-radius:6px; }
::-webkit-scrollbar-thumb:hover{ background:var(--brass); }

.focus-ring:focus-visible{
  outline:2px solid var(--brass-bright);
  outline-offset:3px;
  border-radius:4px;
}

/* ============ HEADER / MASTHEAD ============ */
.masthead{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, var(--ink) 0%, rgba(17,20,27,0.97) 80%, rgba(17,20,27,0.88) 100%);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
  padding-top: env(safe-area-inset-top, 0px);
  transition: padding-top 0.2s ease, background-color 0.2s ease;
}
.masthead-inner{
  max-width:1200px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  transition: padding 0.2s ease;
}
.masthead.collapsed .masthead-inner{
  padding: 8px 24px;
}
.masthead.collapsed .brand,
.masthead.collapsed .masthead-book-btn,
.masthead.collapsed .masthead-search,
.masthead.collapsed .progress-pill {
  display: none !important;
}
.brand{
  display:flex; align-items:baseline; gap:10px;
  flex-shrink:0;
}
.brand-mark{
  font-family:var(--font-display); font-weight:700; font-size:1.55rem;
  color:var(--brass-bright); letter-spacing:0.01em;
}
.brand-sub{
  font-size:0.66rem; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--brass-dim); font-weight:600;
}
.masthead-search{
  flex:1 1 260px; position:relative; max-width:420px;
}
.masthead-search input{
  width:100%; background:var(--wall); border:1px solid var(--line);
  color:var(--parchment); padding:9px 14px 9px 34px; border-radius:8px;
  font-size:16px; font-family:var(--font-body);
  touch-action: manipulation;
}
.masthead-search input::placeholder{ color:#6b7488; }
.masthead-search input:focus{ outline:none; border-color:var(--brass); }
.search-icon{
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  width:14px; height:14px; opacity:0.55; pointer-events:none;
}
.search-results{
  position:absolute; top:calc(100% + 6px); left:0; right:0;
  background:var(--wall-2); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); max-height:340px; overflow-y:auto; z-index:60;
  display:none;
}
.search-results.open{ display:block; }
.search-result-item{
  padding:9px 14px; display:flex; justify-content:space-between; align-items:baseline;
  gap:10px; border-bottom:1px solid rgba(255,255,255,0.04);
}
.search-result-item:last-child{ border-bottom:none; }
.search-result-item:hover, .search-result-item.active{ background:var(--wall-3); }
.search-result-word{ font-family:var(--font-display); font-weight:600; font-size:1.05rem; color:var(--parchment); }
.search-result-meta{ font-size:0.68rem; color:var(--brass-dim); text-transform:uppercase; letter-spacing:0.06em; }
.search-empty{ padding:14px; font-size:0.82rem; color:#6b7488; text-align:center; }

.progress-pill{
  display:flex; align-items:center; gap:9px; margin-left:auto; flex-shrink:0;
}
.progress-ring-wrap{ position:relative; width:34px; height:34px; }
.progress-ring-wrap svg{ transform:rotate(-90deg); }
.progress-ring-track{ fill:none; stroke:var(--wall-3); stroke-width:4; }
.progress-ring-fill{ fill:none; stroke:var(--sage); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset 0.5s ease; }
.progress-text{ font-size:0.78rem; color:var(--parchment-dim); }
.progress-text b{ color:var(--brass-bright); font-weight:700; }

/* ============ FLOOR MAP ============ */
.floor-wrap{ max-width:1200px; margin:0 auto; padding:40px 24px 200px; min-height:calc(100vh - 72px); }

.hero{
  position:relative; padding:38px 8px 46px; text-align:center; overflow:hidden;
}
.hero-arch{
  position:absolute; left:50%; top:-40px; transform:translateX(-50%);
  width:640px; height:320px; opacity:0.35; pointer-events:none;
}
.hero h1{
  font-family:var(--font-display); font-weight:700; font-size:clamp(2.2rem,5vw,3.4rem);
  margin:0 0 10px; color:var(--parchment); position:relative; letter-spacing:0.01em;
}
.hero h1 em{ color:var(--brass-bright); font-style:italic; }
.hero p{
  font-size:0.98rem; color:var(--parchment-dim); max-width:560px; margin:0 auto;
  position:relative; line-height:1.6;
}
.hero-stats{
  display:flex; justify-content:center; gap:36px; margin-top:26px; position:relative; flex-wrap:wrap;
}
.hero-stat{ text-align:center; }
.hero-stat .num{ font-family:var(--font-display); font-size:1.9rem; font-weight:700; color:var(--brass-bright); display:block; }
.hero-stat .lbl{ font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--parchment-dim); }

.corridor{ margin-top:44px; }
.corridor-head{
  display:flex; align-items:center; gap:14px; margin-bottom:16px; padding-bottom:10px;
  border-bottom:1px solid var(--line);
}
.corridor-num{
  font-family:var(--font-display); font-size:0.85rem; color:var(--brass-dim); font-weight:600;
  letter-spacing:0.08em;
}
.corridor-title{ font-family:var(--font-display); font-size:1.5rem; font-weight:600; color:var(--brass-bright); }
.corridor-toggle-btn {
  background: none;
  border: none;
  color: var(--brass-dim);
  cursor: pointer;
  padding: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
}
.corridor-toggle-btn:hover {
  color: var(--brass-bright);
  background: rgba(255, 255, 255, 0.08);
}
.corridor-toggle-btn:active {
  transform: scale(0.95);
}
.corridor-toggle-btn svg {
  display: block;
}
.corridor-desc{ font-size:0.8rem; color:var(--parchment-dim); margin-left:auto; }

.room-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;
}
.room-card{
  background:linear-gradient(160deg, var(--wall-2) 0%, var(--wall) 100%);
  border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px;
  text-align:left; color:inherit; position:relative; overflow:hidden;
  transition:transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.room-card:hover{ transform:translateY(-3px); border-color:var(--brass-dim); box-shadow:var(--shadow); }
.room-card::before{
  content:''; position:absolute; top:0; left:0; width:4px; height:100%;
  background:var(--brass-dim);
}
.room-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
.room-index{ font-family:var(--font-display); font-size:0.72rem; color:var(--brass-dim); letter-spacing:0.1em; text-transform:uppercase; }
.room-name{ font-family:var(--font-display); font-size:1.32rem; font-weight:600; color:var(--parchment); margin:2px 0 4px; }
.room-range{ font-size:0.72rem; color:var(--parchment-dim); font-style:italic; margin-bottom:12px; }
.room-bar-track{ height:5px; background:var(--wall-3); border-radius:4px; overflow:hidden; margin-bottom:8px; }
.room-bar-fill{ height:100%; background:linear-gradient(90deg, var(--sage), #7fb89f); border-radius:4px; transition:width 0.4s ease; }
.room-meta{ display:flex; justify-content:space-between; font-size:0.72rem; color:var(--parchment-dim); }
.room-meta b{ color:var(--brass-bright); }

/* ============ ROOM VIEW ============ */
.room-view{ max-width:1200px; margin:0 auto; padding:26px 24px 200px; min-height:calc(100vh - 72px); }
.room-header{
  display:flex; align-items:center; gap:16px; margin-bottom:22px; flex-wrap:wrap;
}
.back-btn{
  background:var(--wall-2); border:1px solid var(--line); color:var(--parchment-dim);
  padding:8px 14px; border-radius:8px; font-size:0.82rem; display:flex; align-items:center; gap:6px;
  transition:border-color 0.15s ease, color 0.15s ease;
}
.back-btn:hover{ border-color:var(--brass); color:var(--brass-bright); }
.room-title-block{ flex:1; min-width:220px; }
.room-title-block h2{
  font-family:var(--font-display); font-size:2.1rem; font-weight:700; color:var(--parchment); margin:0 0 3px;
}
.room-title-block .sub{ font-size:0.78rem; color:var(--brass-dim); letter-spacing:0.04em; }
.room-progress-block{ text-align:right; min-width:150px; }
.room-progress-num{ font-family:var(--font-display); font-size:1.2rem; color:var(--brass-bright); font-weight:700; }
.room-progress-track{ width:150px; height:6px; background:var(--wall-3); border-radius:4px; overflow:hidden; margin-top:5px; }
.room-progress-fill{ height:100%; background:linear-gradient(90deg,var(--sage),#7fb89f); }
.room-progress-info {
  font-size: 0.72rem;
  color: var(--parchment-dim);
  margin-top: 6px;
  line-height: 1.3;
  max-width: 280px;
  text-align: right;
  margin-left: auto;
}
.loc-nav-btn {
  background: none;
  border: none;
  color: var(--brass-bright);
  cursor: pointer;
  padding: 2px 6px;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.loc-nav-btn:hover {
  opacity: 0.8;
  transform: scale(1.1);
}


.legend{
  display:flex; align-items:center; gap:16px; margin-bottom:22px; padding:10px 16px;
  background:var(--wall-2); border:1px solid var(--line); border-radius:10px; font-size:0.76rem;
  color:var(--parchment-dim); flex-wrap:wrap;
}
.legend-item{ display:flex; align-items:center; gap:6px; }
.legend-swatch{ width:11px; height:11px; border-radius:3px; }
.legend-swatch.case{ background:linear-gradient(135deg, var(--brass-dim), var(--wall-3)); border:1px solid var(--brass); }
.legend-swatch.solo{ background:var(--wall-3); border:1px solid var(--line); }

/* the "wall" of exhibits */
.wall{
  display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start;
}

/* a synonym display-case */
.case{
  border-radius:12px; padding:12px; position:relative;
  background:var(--wall-2);
  border:1px solid var(--case-color, var(--brass-dim));
  box-shadow:0 0 0 1px rgba(255,255,255,0.02) inset, 0 6px 18px rgba(0,0,0,0.3);
  max-width:100%;
}
.case-label{
  font-size:0.62rem; text-transform:uppercase; letter-spacing:0.1em; font-weight:700;
  color:var(--case-color, var(--brass)); margin-bottom:8px; display:flex; align-items:center; gap:6px;
}
.case-label::before{ content:'◆'; font-size:0.6rem; }
.case-items{ display:flex; flex-wrap:wrap; gap:8px; }

.plaque{
  background:var(--parchment); color:var(--ink-text); border-radius:8px;
  padding:9px 36px 9px 12px; min-width:118px; max-width:220px; cursor:pointer; text-align:left;
  border:1px solid var(--parchment-dim); position:relative;
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), 
              box-shadow 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), 
              background-color 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), 
              border-color 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.plaque:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,0.35); }
.plaque-word{
  font-family:var(--font-display); font-weight:700; font-size:1.12rem; line-height:1.15;
  display:flex; align-items:center; gap:6px;
}
.plaque-type{
  font-size:0.6rem; color:var(--ink-text-soft); text-transform:uppercase; letter-spacing:0.06em;
  margin-top:2px; font-weight:600;
}
.plaque-def{
  font-size:0.71rem; color:var(--ink-text-soft); margin-top:4px; line-height:1.35;
}
.plaque.learned{ background:#e2ecdf; border-color:var(--sage); }
.plaque-check{
  position:absolute; top:7px; right:7px; width:24px; height:24px; border-radius:50%;
  border:1.5px solid var(--ink-text-soft); background:transparent; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; padding:0;
}
.plaque.learned .plaque-check{ background:var(--sage); border-color:var(--sage); }
.plaque-check svg{ width:12px; height:12px; opacity:0; }
.plaque.learned .plaque-check svg{ opacity:1; }

.solo-plaque{ }

/* ============ DETAIL PANEL ============ */
.scrim{
  position:fixed; inset:0; background:rgba(8,10,14,0.6); z-index:90;
  opacity:0; pointer-events:none; transition:opacity 0.2s ease;
}
.scrim.open{ opacity:1; pointer-events:auto; }

.detail-panel{
  position:fixed; top:0; right:0; height:100%; width:min(396px,83vw);
  background:linear-gradient(180deg, var(--wall-2), var(--wall));
  border-left:1px solid var(--line); z-index:100; box-shadow:-16px 0 40px rgba(0,0,0,0.5);
  transform:translateX(100%); transition:transform 0.28s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto; padding:56px 26px 60px;
}
.detail-panel.open{ transform:translateX(0); }
.detail-panel.fade-out {
  opacity: 0 !important;
  transform: translateX(0) !important;
  transition: opacity 0.5s ease-out, transform 0.5s ease-out !important;
}
.scrim.fade-out {
  opacity: 0 !important;
  transition: opacity 0.5s ease-out !important;
}
.detail-close{
  position:absolute; top:18px; right:18px; background:none; border:none; color:var(--parchment-dim);
  font-size:1.3rem; line-height:1; padding:6px; cursor:pointer;
}
.detail-close:hover{ color:var(--brass-bright); }
.detail-close-left{
  position:absolute; top:18px; left:18px; background:none; border:none; color:var(--parchment-dim);
  display:flex; align-items:center; justify-content:center; padding:6px; cursor:pointer;
}
.detail-close-left:hover{ color:var(--brass-bright); }

@media (display-mode: standalone) {
  .detail-panel {
    padding-top: calc(56px + env(safe-area-inset-top, 0px));
  }
  .detail-close, .detail-close-left, .learn-toggle {
    top: calc(18px + env(safe-area-inset-top, 0px));
  }
}
.detail-type{
  font-size:0.68rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--brass-dim); font-weight:700;
}
.detail-word-container{
  display:flex; align-items:center; gap:8px; margin:4px 0 16px;
}
.detail-word{
  font-family:var(--font-display); font-size:2.6rem; font-weight:700; color:var(--parchment);
  margin:0; line-height:1.05;
}
.detail-section{ margin-bottom:20px; }
.detail-label{
  font-size:0.64rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--brass);
  font-weight:700; margin-bottom:7px; display:block;
}
.detail-def{ font-size:1rem; color:var(--parchment); line-height:1.55; }
.detail-example-container{
  display:flex; align-items:flex-start; gap:8px;
}
.detail-example{
  font-family:Georgia, serif; font-style:italic; font-size:16px; color:var(--parchment-dim);
  line-height:1.5; padding-left:14px; border-left:2px solid var(--brass-dim);
}
.speak-btn{
  background:none; border:none; color:var(--brass-dim); padding:4px;
  display:inline-flex; align-items:center; justify-content:center;
  transition:color 0.2s ease, transform 0.1s ease; border-radius:4px;
  cursor:pointer; flex-shrink:0;
}
.speak-btn:hover{ color:var(--brass-bright); }
.speak-btn:active{ transform:scale(0.9); }
.speak-btn .wave-1, .speak-btn .wave-2 {
  transition: opacity 0.2s ease;
}
.speak-btn.playing .wave-1 {
  animation: wave-pulse-1 1s infinite alternate;
}
.speak-btn.playing .wave-2 {
  animation: wave-pulse-2 1s infinite alternate;
}
@keyframes wave-pulse-1 {
  0% { opacity: 0.3; }
  100% { opacity: 1; }
}
@keyframes wave-pulse-2 {
  0% { opacity: 0.1; }
  50% { opacity: 0.1; }
  100% { opacity: 1; }
}
.detail-source{ font-size:0.74rem; color:var(--parchment-dim); opacity:0.75; }

.detail-syns{ display:flex; flex-wrap:wrap; gap:6px; }
.syn-chip{
  font-size:0.75rem; padding:4px 10px; background:var(--wall-3); border:1px solid var(--line);
  color:var(--parchment-dim); border-radius:6px; text-decoration:none; transition:all 0.15s ease;
}
.syn-chip.clickable{ color:var(--brass-bright); cursor:pointer; }
.syn-chip.clickable:hover{ border-color:var(--brass); background:var(--wall-2); box-shadow:0 0 8px rgba(201,161,90,0.15); }

.sibling-list{ display:flex; flex-direction:column; gap:8px; }
.sibling-item{
  background:var(--wall-3); border:1px solid var(--line); border-radius:8px; padding:9px 12px;
  cursor:pointer; transition:border-color 0.15s ease;
}
.sibling-item:hover{ border-color:var(--brass); }
.sibling-word{ font-family:var(--font-display); font-weight:600; font-size:1rem; color:var(--brass-bright); }
.sibling-def{ font-size:0.74rem; color:var(--parchment-dim); margin-top:2px; }

.learn-toggle{
  position:absolute; top:18px; left:50%; transform:translateX(-50%);
  width:auto; min-width:120px; padding:7px 14px; border-radius:6px; border:none; background:transparent;
  color:var(--sage); font-weight:700; font-size:0.78rem; display:flex; align-items:center;
  justify-content:center; gap:6px; letter-spacing:0.02em;
  transition:background 0.15s ease, color 0.15s ease;
}
.learn-toggle.on{ background:var(--sage); color:var(--ink); }
.learn-toggle:hover{ background:rgba(92,145,121,0.15); }
.learn-toggle.on:hover{ background:var(--sage); }

.no-siblings{ font-size:0.82rem; color:var(--parchment-dim); font-style:italic; opacity:0.8; }

@media (max-width:640px){
  .hero-stats{ gap:20px; }
  .room-title-block h2{ font-size:1.6rem; }
  .detail-word{ font-size:2rem; }
  .corridor-desc{ display:none; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
}

.hidden-word .plaque-word,
.hidden-word .plaque-type,
.hidden-word .plaque-def {
  opacity:.16;
  filter:blur(0.45px);
  transition:all .15s ease;
  user-select:none;
}
.hidden-word:hover .plaque-word,
.hidden-word:hover .plaque-type,
.hidden-word:hover .plaque-def {
  opacity:1;
  filter:none;
}

.settings-btn{
 background:var(--wall);
 border:1px solid var(--line);
 color:var(--brass-bright);

// ---------- Build dynamic index from database.js ----------
const DB_INDEX = {};
if (typeof coreDatabase !== 'undefined') {
  for (const cat in coreDatabase) {
    for (const set in coreDatabase[cat]) {
      coreDatabase[cat][set].forEach(item => {
        const key = item.word.toLowerCase();
        if (!DB_INDEX[key]) DB_INDEX[key] = [];
        DB_INDEX[key].push({
          w: item.word,
          t: item.type,
          d: item.def,
          e: item.example,
          long_example: item.long_example,
          cat: cat,
          set: set
        });
      });
    }
  }
}

// Helper to find database entry matching word key
function findDbEntry(wKey) {
  let cleanKey = wKey.toLowerCase().trim();
  let typePrefix = null;
  
  // Handle suffix keys like "quibble (v)" or "gorge (n)"
  const suffixMatch = cleanKey.match(/^(.+?)\s*\((.+?)\)$/);
  if (suffixMatch) {
    cleanKey = suffixMatch[1].trim();
    const suffix = suffixMatch[2].trim();
    if (suffix.startsWith('v')) typePrefix = 'v';
    else if (suffix.startsWith('n')) typePrefix = 'n';
    else if (suffix.startsWith('a')) typePrefix = 'a';
  }
  
  const entries = DB_INDEX[cleanKey];
  if (!entries) return null;
  
  if (typePrefix) {
    const match = entries.find(e => e.t.toLowerCase().startsWith(typePrefix));
    if (match) return match;
  }
  
  return entries[0];
}

ROOMS.forEach(room => {

    const dbEntry = findDbEntry(entry.w);
    if (dbEntry) {

      entry.d = dbEntry.d;
      entry.e = dbEntry.e;
      entry.long_example = dbEntry.long_example;
      entry.cat = dbEntry.cat;
      entry.set = dbEntry.set;
    } else {
      entry.t = entry.t || '';
      entry.d = entry.d || '';
      entry.e = entry.e || '';
      entry.long_example = entry.long_example || '';
      entry.cat = entry.cat || '';
      entry.set = entry.set || '';

});

async function sha256(message) {
  if (!message || message === 'public') return 'public';
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

let cachedCloudKeyHash = null;

function pushToCloud() {
  if (localStorage.getItem('greCloudSyncEnabled') !== 'true') return;
  if (!hasUnsavedChanges) return;
  if (!cachedCloudKeyHash) return;

  try {
    let progressDB = {};
    try { progressDB = JSON.parse(localStorage.getItem('greProgressDB') || '{}'); } catch(e){}
    
    let missedWordsDB = {};
    try { missedWordsDB = JSON.parse(localStorage.getItem('greMissedWords') || '{}'); } catch(e){}
    
    const data = {
      progressDB: progressDB,
      missedWordsDB: missedWordsDB,
      learnedWords: Array.from(learned),
      gamification: {
        streak: localStorage.getItem('greStreak') || '0',
        wordsToday: localStorage.getItem('greWordsLearnedToday') || '0',
        lastDate: localStorage.getItem('greLastStudyDate') || ''
      },
      settings: {
        wordCase: localStorage.getItem('greWordCase'),
        autoShow: localStorage.getItem('greAutoShowSentences'),
        autoPronounce: localStorage.getItem('greAutoPronounce'),
        theme: localStorage.getItem('greTheme')
      },
      lastUpdated: Date.now()
    };

    fetch(`${FIREBASE_URL}/${cachedCloudKeyHash}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
      keepalive: true
    });
    hasUnsavedChanges = false;
  } catch (err) {
    console.error("Failed to sync to cloud:", err);
  }
}

          if (data && data.learnedWords) {
            const cloudSet = new Set(data.learnedWords);
            let merged = false;
            
            // Check if local has words not in cloud
            for (let w of learned) {
              if (!cloudSet.has(w)) {
                merged = true;
                break;
              }
            }
            
            // Add cloud words to local
            for (let w of data.learnedWords) {
              if (!learned.has(w)) {
                learned.add(w);
                merged = true;
              }
            }
            
            if (merged) {
              localStorage.setItem('learned-words', JSON.stringify(Array.from(learned)));
              hasUnsavedChanges = true;
            }
          } else if (learned.size > 0) {
            hasUnsavedChanges = true;
          }
        }
      } catch (err) {
        console.error("Failed to pull from cloud during load:", err);
      }
    }
  }
  
  storageReady = true;
}

async function saveProgress(){
  try{
    if(window.storage) await window.storage.set('learned-words', JSON.stringify(Array.from(learned)), false);
    localStorage.setItem('learned-words', JSON.stringify(Array.from(learned)));
    hasUnsavedChanges = true;
  }catch(e){}
}

// ---------- Build a flat index for search & sibling lookups ----------
const WORD_MAIN_ROOMS = {};
ROOMS.forEach((room, ri)=>{
  room.words.forEach(entry=>{
    const key = entry.w.toLowerCase();
    if(WORD_MAIN_ROOMS[key] === undefined){
      WORD_MAIN_ROOMS[key] = ri;
    }
  });
});

const WORD_INDEX = {}; // lowercase word -> {entry, roomIdx}
ROOMS.forEach((room, ri)=>{
  room.words.forEach(entry=>{
    if(learnedDisplayMode==='remove' && learned.has(entry.w.toLowerCase())) return;
    WORD_INDEX[entry.w.toLowerCase()] = { entry, roomIdx: ri };
  });
});

function getWordRooms(wordKey) {
  const list = [];
  if (!wordKey) return list;
  const cleanKey = wordKey.toLowerCase();
  ROOMS.forEach((room, ri) => {
    // Check if it is a primary word in this room
    const isPrimary = room.words.some(w => w.w.toLowerCase() === cleanKey);
    if (isPrimary) {
      if (!list.some(r => r.roomIdx === ri)) {
        list.push({ roomIdx: ri, name: room.name });
      }
      return;
    }
    // Check if it is a sibling of any primary word in this room
    const isSibling = room.words.some(w => w.sib && w.sib.some(s => s.toLowerCase() === cleanKey));
    if (isSibling) {
      if (!list.some(r => r.roomIdx === ri)) {
        list.push({ roomIdx: ri, name: room.name });
      }
    }
  });
  return list;
}

window.getWordRooms = getWordRooms;

function clusterColorFor(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = (hash*31 + str.charCodeAt(i)) >>> 0; }
  return CLUSTER_COLORS[hash % CLUSTER_COLORS.length];
}

function totalWords(){ return Object.keys(WORD_INDEX).length; }
function nativeWordsInRoom(room, ri){
  let c = 0;
  room.words.forEach(w=>{
    if(WORD_MAIN_ROOMS[w.w.toLowerCase()] === ri) c++;
  });
  return c;
}
function learnedInRoom(room, ri){
  let c = 0;
  room.words.forEach(w=>{
    if(WORD_MAIN_ROOMS[w.w.toLowerCase()] === ri && learned.has(w.w.toLowerCase())) c++;
  });
  return c;
}
function getRoomProgress(roomIdx) {
  const room = ROOMS[roomIdx];
  if (!room) return { lc: 0, total: 0 };
  const nativeTotal = nativeWordsInRoom(room, roomIdx);
  const lc = learnedInRoom(room, roomIdx);
  return { lc, total: nativeTotal };
}

      <circle class="progress-ring-fill" cx="${size/2}" cy="${size/2}" r="${r}"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
    </svg>
  </div>`;
}

function renderRoom(idx){
  const room = ROOMS[idx];
  const lc = learnedInRoom(room, idx);
  const nativeTotal = nativeWordsInRoom(room, idx);
  const rp = nativeTotal ? Math.round((lc/nativeTotal)*100) : 0;
  // group into cluster-cases vs solo, preserving order of first appearance
  const seen = new Set();
  let wallHtml = '';
  room.words.forEach(entry=>{
    const key = entry.w.toLowerCase();
    if(seen.has(key)) return;
    if(entry.sib && entry.sib.length>0){
      const memberKeys = [key, ...entry.sib];
      memberKeys.forEach(k=>seen.add(k));
      const color = clusterColorFor(memberKeys.slice().sort().join(','));
      const label = memberKeys.slice().sort()[0];
      let itemsHtml = '';
      memberKeys.forEach(mk=>{
        const m = WORD_INDEX[mk];
        if(!m) return; if(learnedDisplayMode==='hide' && learned.has(m.entry.w.toLowerCase())) return;
        itemsHtml += plaqueHtml(m.entry);
      });
      if(itemsHtml.trim()) wallHtml += `
        <div class="case" style="--case-color:${color}">
          <div class="case-label" style="color:${color}">Word family &middot; ${escapeHtml(label)}</div>
          <div class="case-items">${itemsHtml}</div>
        </div>`;
    } else {
      seen.add(key);
      if(!(learnedDisplayMode==='hide' && learned.has(key))){
        wallHtml += `<div class="solo-plaque">${plaqueHtml(entry)}</div>`;
      }
    }
  });

  app.innerHTML = `
    ${masthead()}
    <div class="room-view">
      <div class="room-header">
        <div class="room-title-block">
          <h2>${room.name}</h2>

      <div class="legend">
        <div class="legend-item"><span class="legend-swatch case"></span> Glass case = synonym family (learn together)</div>
        <div class="legend-item"><span class="legend-swatch solo"></span> Single frame = stands alone</div>
      </div>
      <div class="wall">${wallHtml}</div>
    </div>
  `;
  attachMastheadHandlers();
}

function plaqueHtml(entry){
  const key = entry.w.toLowerCase();

  const displayWord = entry.w.replace(/\s*\([^)]+\)$/i, '').replace(/\s*\*$/i, '');
  return `
    <div class="plaque${isLearned?' learned':''}${hidden?' hidden-word':''}" data-word="${escapeAttr(key)}" onclick="openDetail('${escapeAttr(key)}')">
      <button class="plaque-check focus-ring" onclick="event.stopPropagation(); quickToggle('${escapeAttr(key)}')" aria-label="Mark learned">

      <div class="plaque-word">${escapeHtml(displayWord)}</div>
      <div class="plaque-type">${escapeHtml(entry.t)}</div>
      <div class="plaque-def">${escapeHtml(entry.d)}</div>
    </div>`;
}

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
        </button>
        <div class="masthead-search">

          <input type="text" id="searchInput" placeholder="Search any of ${total.toLocaleString()} words&hellip;" autocomplete="off" class="focus-ring">

<option value="blur" ${learnedDisplayMode==='blur'?'selected':''}>Blur learned words</option>

<div class="progress-pill">
          <div class="progress-ring-wrap">
            <svg width="34" height="34">
              <circle class="progress-ring-track" cx="17" cy="17" r="${r}"></circle>
              <circle class="progress-ring-fill" cx="17" cy="17" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
            </svg>

}

function attachMastheadHandlers(){
  const input = document.getElementById('searchInput');
  const resultsBox = document.getElementById('searchResults');
  if(!input) return;

  let activeIndex = -1;
  let currentMatches = [];

  function doSearch(q){
    q = q.trim().toLowerCase();
    if(q.length===0){ resultsBox.classList.remove('open'); resultsBox.innerHTML=''; return; }
    const starts = [];
    const contains = [];
    Object.keys(WORD_INDEX).forEach(key=>{
      if(key.startsWith(q)) starts.push(key);
      else if(key.includes(q)) contains.push(key);
    });
    currentMatches = [...starts.sort(), ...contains.sort()].slice(0,8);
    activeIndex = -1;
    if(currentMatches.length===0){
      resultsBox.innerHTML = `<div class="search-empty">No word matches &ldquo;${escapeHtml(q)}&rdquo;</div>`;
    } else {
      resultsBox.innerHTML = currentMatches.map((key,i)=>{
        const item = WORD_INDEX[key];
        return `<div class="search-result-item" data-idx="${i}" onclick="jumpToWord('${escapeAttr(key)}')">
          <span class="search-result-word">${escapeHtml(item.entry.w.replace(/\s*\([^)]+\)$/i, '').replace(/\s*\*$/i, ''))}<span style="font-size:0.75em; font-family:var(--font-sans); color:var(--brass-dim); font-weight:normal; margin-left:6px; font-style:italic;">(${escapeHtml(item.entry.t)})</span></span>
          <span class="search-result-meta">${escapeHtml(ROOMS[item.roomIdx].name)}</span>
        </div>`;
      }).join('');
    }
    resultsBox.classList.add('open');
  }

  input.addEventListener('input', e=> doSearch(e.target.value));
  input.addEventListener('focus', e=> { if(e.target.value) doSearch(e.target.value); });
  input.addEventListener('keydown', e=>{
    const items = resultsBox.querySelectorAll('.search-result-item');
    if(e.key==='ArrowDown'){ e.preventDefault(); activeIndex = Math.min(activeIndex+1, items.length-1); updateActive(items); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); activeIndex = Math.max(activeIndex-1, 0); updateActive(items); }
    else if(e.key==='Enter'){
      if(activeIndex>=0 && currentMatches[activeIndex]) jumpToWord(currentMatches[activeIndex]);
    } else if(e.key==='Escape'){
      resultsBox.classList.remove('open'); input.blur();
    }
  });
  document.addEventListener('click', e=>{
    if(!input.contains(e.target) && !resultsBox.contains(e.target)){
      resultsBox.classList.remove('open');
    }
  });

  function updateActive(items){
    items.forEach(it=>it.classList.remove('active'));
    if(items[activeIndex]){
      items[activeIndex].classList.add('active');
      items[activeIndex].scrollIntoView({block:'nearest'});
    }
  }
}

function jumpToWord(key, roomIdx){
  let targetRoomIdx = roomIdx;
  if (targetRoomIdx === undefined) {
    const item = WORD_INDEX[key];
    targetRoomIdx = item ? item.roomIdx : 0;
  }

  // If the word is learned and hidden, switch mode to show so it is visible
  if(learned.has(key) && learnedDisplayMode === 'hide'){
    learnedDisplayMode = 'show';
    localStorage.setItem('mp-learned-mode', 'show');
  }

  lastRoomIdx = targetRoomIdx;
  localStorage.setItem('mp-last-room', targetRoomIdx);

  closeDetail();
  currentView = { type:'room', idx:targetRoomIdx };
  render();
  const rb = document.getElementById('searchResults');
  if(rb) rb.classList.remove('open');
  const input = document.getElementById('searchInput');
  if(input) {
    input.value = '';
    input.blur(); // Dismiss the mobile keyboard to prevent viewport layout conflict
  }

  // Scroll to the card and flash highlight it
  setTimeout(()=>{
    const el = document.querySelector(`.plaque[data-word="${key}"]`);
    if(el){
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      
      // Force layout reflow so mobile browsers register the initial style state
      el.offsetHeight;
      
      // Add the highlight class in the next frame to trigger the transition
      requestAnimationFrame(() => {
        el.classList.add('search-highlight');
      });
      
      setTimeout(()=>{
        el.classList.remove('search-highlight');
      }, 2500);
    }
  }, 300); // 300ms allows the mobile keyboard dismissal animation to complete
}
window.jumpToWord = jumpToWord;


// ---------- Utils ----------
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function highlightWord(sentence, word) {
  if (!sentence) return '';
  if (!word) return escapeHtml(sentence);
  const cleanWord = word.replace(/\s*\([^)]+\)$/i, '').replace(/\s*\*$/i, '').trim();
  if (!cleanWord) return escapeHtml(sentence);
  const escaped = cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp("(" + escaped + "[a-zA-Z]*)", "gi");
  const escapedSentence = escapeHtml(sentence);
  return escapedSentence.replace(regex, (match) => `<strong style="color:var(--brass-bright); font-weight:700;">${match}</strong>`);
}
function escapeAttr(str){
  return String(str).replace(/'/g, "\\'");
}

let currentUtterance = null;
let currentSpeakingBtn = null;

function speakText(text, btn, rate = 1.0) {
  if (!window.speechSynthesis) return;
  if (currentSpeakingBtn === btn && btn.classList.contains('playing')) {
    window.speechSynthesis.cancel();
    btn.classList.remove('playing');
    currentSpeakingBtn = null;
    currentUtterance = null;
    return;
  }
  if (currentSpeakingBtn) {
    currentSpeakingBtn.classList.remove('playing');
  }
  window.speechSynthesis.cancel();
  if (currentUtterance) {
    currentUtterance.onend = null;
    currentUtterance.onerror = null;
    currentUtterance.onstart = null;
    currentUtterance = null;
  }
  if (!text) return;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = rate;
  currentUtterance = utterance;
  if (btn) {
    currentSpeakingBtn = btn;
    utterance.onstart = () => {
      if (currentSpeakingBtn === btn) btn.classList.add('playing');
    };
    utterance.onend = () => {
      if (currentSpeakingBtn === btn) {
        btn.classList.remove('playing');
        currentSpeakingBtn = null;
      }
      currentUtterance = null;
    };
    utterance.onerror = () => {
      if (currentSpeakingBtn === btn) {
        btn.classList.remove('playing');
        currentSpeakingBtn = null;
      }
      currentUtterance = null;
    };
  }
  setTimeout(() => {
    window.speechSynthesis.speak(utterance);
  }, 50);
}
function speakCurrentWord(btn) {
  if (!detailWordKey) return;
  const item = WORD_INDEX[detailWordKey];
  if (item && item.entry) {
    speakText(item.entry.w.replace(/\s*\([^)]+\)$/i, '').replace(/\s*\*$/i, ''), btn);
  }
}
function speakCurrentExample(btn) {
  if (!detailWordKey) return;
  const item = WORD_INDEX[detailWordKey];
  if (item && item.entry) {
    speakText(item.entry.e, btn, 1.4);
  }
}
function speakCurrentLongExample(btn) {
  if (!detailWordKey) return;
  const item = WORD_INDEX[detailWordKey];
  if (item && item.entry && item.entry.long_example) {
    speakText(item.entry.long_example, btn, 1.2);
  }
}

// ---------- Init ----------
(async function init(){
  app.innerHTML = `<div style="padding:80px;text-align:center;color:#8f7442;font-family:var(--font-display);font-size:1.3rem;">Unlocking the palace doors&hellip;</div>`;
  await loadProgress();

  // Compute completed rooms (all words in room are learned) for dashboard
  let completedRooms = 0;
  ROOMS.forEach((room, ri) => {
    const { lc, total } = getRoomProgress(ri);
    if (total > 0 && lc >= total) completedRooms++;
  });
  localStorage.setItem('mp-completed-rooms', completedRooms);

  render();
})();
</script>

(function(){

  b.textContent=mode.charAt(0).toUpperCase()+mode.slice(1);

document.addEventListener('click',()=>setTimeout(updateModeBadge,50));

// Collapse navbar on scroll
window.addEventListener('scroll', function() {
  const masthead = document.querySelector('.masthead');
  if (masthead) {
    if (currentView.type === 'room' || window.scrollY > 40) {
      masthead.classList.add('collapsed');
    } else {
      masthead.classList.remove('collapsed');
    }
  }
}, { passive: true });

// Completely block zoom on mobile
document.addEventListener('touchstart', function(e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

document.addEventListener('gesturestart', function(e) {
  e.preventDefault();
}, { passive: false });

let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    const target = e.target;
    const isInteractive = target && (
      target.tagName === 'BUTTON' || 
      target.tagName === 'A' || 
      target.tagName === 'INPUT' || 
      target.tagName === 'SELECT' || 
      target.tagName === 'LABEL' ||
      target.closest('button') || 
      target.closest('a') ||
      target.closest('.interactive') ||
      target.closest('.plaque') ||
      target.closest('.room') ||
      target.classList.contains('cursor-pointer')
    );
    if (!isInteractive) {
      e.preventDefault();
    }
  }
  lastTouchEnd = now;
}, { passive: false });


document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === 'hidden') {
    pushToCloud();
  }
});
window.addEventListener("pagehide", () => {
  pushToCloud();
});

// Disable iOS swipe-to-go-back gesture
let touchStartX = 0;
let touchStartY = 0;

document.addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

document.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1) {
    const touchX = e.touches[0].clientX;
    const touchY = e.touches[0].clientY;
    const diffX = touchX - touchStartX;
    const diffY = touchY - touchStartY;

    // If the touch started near the left or right edges (within 30px) and is a horizontal swipe
    if ((touchStartX < 30 || touchStartX > window.innerWidth - 30) && Math.abs(diffX) > Math.abs(diffY)) {
      e.preventDefault();
    }
  }
}, { passive: false });
})();
</script>
